[project]
name = "proslenkey"
version = "1.2.0"
description = "A lightweight GTK4 application launcher for Wayland"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "hikyae", email = "h1ky43@gmail.com" },
]
keywords = ["app-launcher", "fcitx5", "launcher", "linux", "sway", "wayland"]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "PyGObject>=3.54.3",
]

[project.urls]
Homepage = "https://github.com/hikyae/proslenkey"
Issues = "https://github.com/hikyae/proslenkey/issues"

[project.gui-scripts]
proslenkey = "src.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ARG002",  # Unused method argument
  "D100",  # Missing docstring in public module
  "D102",  # Missing docstring in public method
  "D103",  # Missing docstring in public function
  "D107",  # Missing docstring in `__init__`
  "S602",  # `subprocess` call with `shell=True` identified, security issue
  "SIM105",  # Use `contextlib.suppress(Exception)` instead of `try`-`except`-`pass`
  "E402",  # Module level import not at top of file
]
